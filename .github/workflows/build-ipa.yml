name: Build Unsigned IPA

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Archive And Package Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Capture short commit SHA
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Archive unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Runner.xcarchive/Products/Applications/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "Conduit-unsigned-${sha_short}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-unsigned-${{ env.sha_short }}.ipa
          path: ios/Conduit-unsigned-${{ env.sha_short }}.ipa
          if-no-files-found: error
